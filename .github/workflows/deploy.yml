name: Build and deploy

on:
  push:
    branches: [main]
  # A push made by GITHUB_TOKEN does not trigger other workflows - GitHub
  # blocks that to prevent recursion. Without this trigger the nightly data
  # commit would land in the repository and never reach the published page,
  # which is the single most likely way this setup silently stops working.
  workflow_run:
    workflows: ["Refresh market snapshot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # `npm run build` runs tsc --noEmit first, so a type error fails the
      # deploy rather than shipping a page with a blank table cell.
      - name: Build
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
